# Pinned upstream revisions for a reproducible CDE-on-Wayland build.
# Update deliberately; River and CoW must be protocol-compatible.
#
# Every *_REF is an exact commit (or, for River, a release tag), never a moving
# branch, so a build cannot drift with upstream.  scripts/verify-pins.sh -- and
# the CI "pins" job -- confirm each one still resolves.

# xlib-wayland — the Wayland libX11 shim.  All shim accommodations for CDE are
# made in THIS repository, not here; we only consume it.
# main, 2026-10-15 (Firefox/EWMH/headless-compositor work).
XLIB_WAYLAND_REPO=https://github.com/jmalcolm137/xlib-wayland.git
XLIB_WAYLAND_REF=bf07693e94479200e1cf93cdb7cbcc844aae281f
# Requires at least:
#   b9a3142  XOpenDisplay reports an X display string (DtSvc parses it)
#   a8c2a3e  Xmb/XwcTextExtents fill ink and logical independently
#            (DtTerm's fontset path passes ink=NULL and crashed without this)
#   cec9604  XIM is a real bridge to the compositor's zwp_text_input_v3
#            (input methods compose; River + ibus)
# See DESIGN.md §7.5.

# CDE (imake tree) — default branch `master`.
CDE_REPO=https://github.com/lkujaw/cde.git
CDE_REF=e4b43aa1c4dacf72ceab6bfe73f1414396928883

# CoW window manager (River client).  CoW 0.4 was released 2026-10-25; this is
# main at that point plus the post-release version-string commit.
COW_REPO=https://codeberg.org/cow-wm/cow.git
COW_REF=fd999be6af4f87f82d061565bf2b2638f748e31c

# River compositor.  CDE-on-Wayland is tested against the distro package
# (Arch: river 0.5.0); the tag pins the source build (`build-cow.sh
# --with-river`) to the same release.  The tag resolves to the commit below.
RIVER_REPO=https://codeberg.org/river/river.git
RIVER_REF=v0.5.0

# libXt and Open Motif sources.  The shim replaces libX11, so libXt and Motif
# must be built against it; fetch-sources.sh unpacks these release tarballs and
# build-shim.sh builds them.  build-cde.sh also reads Motif's bitmaps from
# $MOTIF_SRC/bitmaps.  Pinned with checksums.
LIBXT_VERSION=1.3.1
LIBXT_URL=https://www.x.org/releases/individual/lib/libXt-1.3.1.tar.xz
LIBXT_SHA256=e0a774b33324f4d4c05b199ea45050f87206586d81655f8bef4dba434d931288

MOTIF_VERSION=2.3.8
MOTIF_URL=https://downloads.sourceforge.net/project/motif/Motif%202.3.8%20Source%20Code/motif-2.3.8.tar.gz
MOTIF_SHA256=859b723666eeac7df018209d66045c9853b50b4218cecadb794e2359619ebce7
