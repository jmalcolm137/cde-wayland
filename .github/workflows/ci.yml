name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          for f in config/*.sh config/river-init; do sh -n "$f"; done
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh config/*.sh config/river-init

  pins:
    name: pinned revisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: versions.lock resolves upstream
        run: scripts/verify-pins.sh

  shim:
    name: xlib-wayland (pinned)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git meson ninja pkgconf \
            wayland wayland-protocols libxkbcommon cairo freetype2 fontconfig \
            libpng pixman \
            libx11 libxext libxrender libxcb libxi libxft libxt libxau libxcursor \
            libxdamage libxfixes libxrandr libxinerama libxcomposite xorgproto
      - uses: actions/checkout@v4
      - name: Fetch the pinned shim
        run: |
          source versions.lock
          git init xlib-wayland
          git -C xlib-wayland remote add origin "$XLIB_WAYLAND_REPO"
          git -C xlib-wayland fetch --depth 1 origin "$XLIB_WAYLAND_REF"
          git -C xlib-wayland checkout -q FETCH_HEAD
      - name: Build
        run: |
          meson setup xlib-wayland/build xlib-wayland \
            --prefix=/usr --buildtype=release
          ninja -C xlib-wayland/build
      - name: Test
        run: meson test -C xlib-wayland/build --print-errorlogs

  cow:
    name: cow (pinned)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git meson ninja pkgconf \
            wayland wayland-protocols libxkbcommon pango cairo libbsd \
            bison flex libevent libxml2
      - uses: actions/checkout@v4
      - name: Fetch the pinned revision
        run: |
          source versions.lock
          git init cow
          git -C cow remote add origin "$COW_REPO"
          git -C cow fetch --depth 1 origin "$COW_REF"
          git -C cow checkout -q FETCH_HEAD
      - name: Build
        run: |
          meson setup cow/build cow --prefix=/usr --buildtype=release
          ninja -C cow/build
      - name: Test
        run: meson test -C cow/build --print-errorlogs

  # The full stack (shim + Xt/Motif + CoW + CDE + Front Panel).  Manual only:
  # it is long, and its host dependency list is still being proven.
  full:
    name: full build (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 360
    steps:
      - name: Dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git meson ninja cmake pkgconf rsync ksh \
            autoconf automake libtool bison flex byacc \
            wayland wayland-protocols libxkbcommon cairo freetype2 fontconfig \
            pango libxrender libxcb libxi libxft libpng pixman libbsd \
            libevent libxml2 rpcsvc-proto \
            libx11 libxext libxmu libxpm libxt libxaw libsm libice \
            libxau libxcursor libxdmcp libxp \
            libxinerama libxrandr libxss libxdamage libxfixes libxcomposite \
            libjpeg-turbo bzip2 libtirpc util-linux zlib xbitmaps ncurses \
            opensp imagemagick tcl \
            xorgproto
      - uses: actions/checkout@v4
      - name: Build the whole stack
        run: make PREFIX="$PWD/prefix" all
      - name: Build-result tree
        run: |
          find prefix -maxdepth 3 -type d | sort | head -50
