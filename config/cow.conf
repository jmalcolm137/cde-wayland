# cde-wayland CoW configuration overlay.
#
# CoW loads its package-owned cow-defaults.conf first, then this file, so this
# is an overlay: it only overrides what a CDE session needs and leaves the rest
# of CoW's defaults in place.  Install/copy to ~/.config/cow/cow.conf (or point
# XDG_CONFIG_HOME at a directory containing it).
#
# The classic CDE terminal is dtterm; the launcher entries below are CDE
# programs.  This file is intentionally small; see cow-defaults.conf for the
# full command surface.

# The terminal command used by binds and menus.
alias terminal exec dtterm

# A CDE application menu, modelled on the Front Panel's "Application Manager"
# style.  Replace `exec NAME` with real command lines as the apps are built.
menu-add CDEApps  "CDE Applications"  title

menu-add CDEApps  "Terminal"          "exec dtterm"
menu-add CDEApps  "File Manager"      "exec dtfile -"
menu-add CDEApps  "Text Editor"       "exec dtpad"
menu-add CDEApps  "Calculator"        "exec dtcalc"
menu-add CDEApps  "Calendar"          "exec dtcm"
menu-add CDEApps  "Style Manager"     "exec dtstyle"
menu-add CDEApps  "Help"              "exec dthelpview -display :0"
menu-add CDEApps  -                   -

menu-add CDEApps  "Log Out"           "exec cde-session-logout"

# A right-click root menu that opens the CDE application list.
# (Mouse button numbers are CoW's; 3 is right button.)
menu-add RootMenu "Desktop" title
menu-add RootMenu "Applications" "popup CDEApps"
menu-add RootMenu - -
menu-add RootMenu "Window list"  "popup WindowOps"
menu-add RootMenu "Restart CoW"  "restart"
bind -m RootMenu 3 popup RootMenu

# A CDE-ish MWM look: teal titlebars with a light active gradient.  This is
# deliberately close to CDE's default palette and can be themed from
# dtstyle later.
menu-style bg                 0x808080
menu-style fg                 0x000000
menu-style title.bg           0x0f3977
menu-style title.fg           0xffffff
