# cde-wayland CoW configuration overlay.
#
# CoW loads its package cow-defaults.conf first, then this file, so this only
# overrides what a CDE session needs.  Install as ~/.config/cow/cow.conf (or
# point XDG_CONFIG_HOME at a directory containing it).
#
# CoW is the real window manager.  The CDE Front Panel is the real dtwm, run as
# a contained panel (see DESIGN.md §5.2); the shim reports its WM_CLASS
# instance as the Wayland app_id, so it matches %dtwm.  dtwm's workspace/
# backdrop overlays are override-redirect and stay hidden, so the panel is the
# only dtwm window on screen.

# Reserve a strip at the bottom for the panel.  (Tune against a live River
# session; the panel is a normal toplevel, not a layer-shell surface.)
set reserved.bottom 85

# The panel: top layer, undecorated, sticky, out of the focus cycle, locked to
# the bottom of the usable area.
style -g -n cde-panel -s %FrontPanel {
    layer top
    sticky.desk true
    sticky.page true
    circulate.skip true
    placement.anchor bottom
    decor {
        border.width 0
        titlebar.enabled false
    }
}

# A CDE-ish MWM palette for ordinary windows.
decor -d default border.width 6
decor -d default titlebar.active_colour 0x0f3977
decor -d default titlebar.inactive_colour 0x808080
decor -a default

# The terminal used by binds and menus.
alias terminal exec dtterm

# A CDE application menu, as a secondary launcher alongside the panel.
menu-add -T CDEApps "CDE Applications" title
menu-add CDEApps "Files"       "exec dtfile -"
menu-add CDEApps "Terminal"    "exec dtterm"
menu-add CDEApps "Editor"      "exec dtpad"
menu-add CDEApps "Calculator"  "exec dtcalc"
menu-add CDEApps "Style"       "exec dtstyle"
menu-add CDEApps - -
menu-add CDEApps "Next Desk"   "desk -n"
menu-add CDEApps "Prev Desk"   "desk -p"

# The Workspace Manager's root menu (dtwm's DtRootMenu), posted when the
# desktop is right-clicked.  The workspace operations go through cde-wsm, which
# asks dtwm (the Workspace Manager) to make the change, so the Front Panel and
# every client stay in step instead of CoW moving on its own.
menu-add -T CDEWorkspace "Workspace Menu" title
menu-add CDEWorkspace "Previous Workspace" "exec cde-wsm prev"
menu-add CDEWorkspace "Next Workspace"     "exec cde-wsm next"
menu-add CDEWorkspace - -
menu-add CDEWorkspace "Terminal"           "exec dtterm"
menu-add CDEWorkspace "Files"              "exec dtfile -"

bind L+Return exec dtterm
bind L+d menu-show CDEApps
# Btn3 on the root posts the Workspace Manager menu, as in CDE.
mouse R:0+right menu-show CDEWorkspace
