# cde-wayland CoW configuration overlay.
#
# CoW loads its package cow-defaults.conf first, then this file, so this only
# overrides what a CDE session needs.  Install as ~/.config/cow/cow.conf (or
# point XDG_CONFIG_HOME at a directory containing it).
#
# CoW is the real window manager.  The CDE Front Panel is the real dtwm, run as
# a contained panel (see DESIGN.md §5.2); the shim reports its WM_CLASS
# instance as the Wayland app_id, so it matches %dtwm.  dtwm's workspace/
# backdrop overlays are override-redirect and stay hidden, so the panel is the
# only dtwm window on screen.

# Reserve a strip at the bottom for the panel.  (Tune against a live River
# session; the panel is a normal toplevel, not a layer-shell surface.)
set reserved.bottom 85

# CDE/MWM focus is click-to-focus (CoW defaults to sloppy/point-to-focus).
set focus click

# CDE workspaces are whole screens, not CoW's default 3x3 page grid per desk.
# With pages enabled the viewport can sit on one page while windows open on
# another, so they appear off-screen.  One page per desk keeps every window on
# the visible screen; the workspaces themselves are the desks (cde-wsm-desk
# maps workspace N to desk N).
set desktop_size 1 1

# The panel: top layer, undecorated, sticky, out of the focus cycle, locked to
# the bottom of the usable area.
style -g -n cde-panel -s %FrontPanel {
    layer top
    sticky.desk true
    sticky.page true
    circulate.skip true
    placement.anchor bottom
    decor {
        border.width 0
        titlebar.enabled false
    }
}

# The Front Panel's sub-panels.  dtwm creates each sub-panel as its own
# toplevel; the shim reports it as app_id FrontPanelSubpanel-<label>.  They are
# part of the panel: undecorated, on top, sticky and out of the focus cycle,
# docked directly above the panel box they belong to.
#
# dtwm does not tell the window manager where a sub-panel goes (in real CDE it
# positions them itself), and a Wayland toplevel cannot position itself, so the
# placement is here: x aligns the sub-panel with its control in the panel, y
# docks its bottom against the panel top (554 on this 1280x720 output, where the
# panel is 81px tall).  These follow the default Front Panel layout, which
# assumes the panel is centred on 1280x720.
# A borderless profile for the sub-panels.
decor -d nodecor border.width 0
decor -d nodecor titlebar.enabled false

# Applied on map (after the view has an output -- a style's placement.x/y runs
# too early and crashes).  decor -a strips the frame.  Place each sub-panel
# relative to the panel itself (found by app_id) so it is independent of screen
# size and the panel's position: first jump to the panel's own x/y, then move
# right by the box offset (a fixed property of the default Front Panel layout)
# and up by the sub-panel's height so its bottom sits on the panel's top.
# The DSL has no arithmetic, hence the two-step moves.
# `window-move -a bottom` docks the sub-panel bottom-centre of the usable area
# exactly like the panel; `-y -81` lifts it by the panel's height onto the
# panel's top edge.  The x nudge is `(subpanel_width - panel_width)/2 + box
# offset`, i.e. from centre to the box, and is constant because the panel has a
# fixed width and is centred.  No absolute screen coordinates, so it is
# independent of screen size.
rule -g -T on-map -n cde-sub-persapps -s %FrontPanelSubpanel-Personal-Applications script {
    decor -a nodecor
    window-move -a bottom
    window-move -y -81
    window-move -x -225
}
rule -g -T on-map -n cde-sub-printers -s %FrontPanelSubpanel-Personal-Printers script {
    decor -a nodecor
    window-move -a bottom
    window-move -y -81
    window-move -x +262
}
rule -g -T on-map -n cde-sub-info -s %FrontPanelSubpanel-Information script {
    decor -a nodecor
    window-move -a bottom
    window-move -y -81
    window-move -x +457
}

# A sub-panel is logically part of the panel, so it belongs in the top layer
# too.  Left in the default layer it sits below ordinary windows: a window that
# overlaps a sub-panel then wins the pointer at the overlap, and a drag started
# elsewhere is delivered to that window instead of the sub-panel -- Motif DnD to
# the sub-panel's install zone silently failed whenever the source window or any
# other window covered it.  layer is reapplied on reload, so this also corrects
# sub-panels that are already mapped.
style -g -n cde-subpanel-persapps -s %FrontPanelSubpanel-Personal-Applications {
    layer top
}
style -g -n cde-subpanel-printers -s %FrontPanelSubpanel-Personal-Printers {
    layer top
}
style -g -n cde-subpanel-info -s %FrontPanelSubpanel-Information {
    layer top
}

# A CDE-ish MWM palette for ordinary windows.
decor -d default border.width 6
decor -d default titlebar.active_colour 0x0f3977
decor -d default titlebar.inactive_colour 0x808080

# Icons (minimized windows): CDE-style 64px icons with a flat title plate, in a
# box along the bottom of the usable area.  CoW has no separate icon-box
# container like dtwm's, so this is the closest equivalent.
decor -d default icon.enabled true
decor -d default icon.size 64
decor -d default icon.image auto
decor -d default icon.background 0xaeb2c3
decor -d default icon.foreground 0x000000
decor -d default icon.active.background 0x0f3977
decor -d default icon.active.foreground 0xffffff
decor -d default icon.title_relief flat
decor -a default
icon-placement box full
icon-placement compact true

# The terminal used by binds and menus.
alias terminal exec dtterm

# A CDE application menu, as a secondary launcher alongside the panel.
menu-add -T CDEApps "CDE Applications" title
menu-add CDEApps "Files"       "exec dtfile -"
menu-add CDEApps "Terminal"    "exec dtterm"
menu-add CDEApps "Editor"      "exec dtpad"
menu-add CDEApps "Calculator"  "exec dtcalc"
menu-add CDEApps "Style"       "exec dtstyle"
menu-add CDEApps - -
menu-add CDEApps "Next Desk"   "desk -n"
menu-add CDEApps "Prev Desk"   "desk -p"

# The Workspace Manager's root menu, posted when the desktop is right-clicked.
# This is CDE's DtRootMenu (the labels and order match dtwm's sys.dtwmrc):
#   Workspace Menu / Shuffle Up / Shuffle Down / Refresh /
#   Minimize-Restore Front Panel / -- / Restart Workspace Manager... / -- /
#   Log out...
# Shuffle is MWM's window circulate -> focus next/previous.  CoW has no repaint
# command, so Refresh is a no-op.  The items after the last separator are
# cde-wayland additions (the panel has the workspace switches; these keep the
# convenience items reachable).
menu-add -T CDEWorkspace "Workspace Menu" title
menu-add CDEWorkspace "Shuffle Up"                   "focus -nw"
menu-add CDEWorkspace "Shuffle Down"                 "focus -pw"
menu-add CDEWorkspace "Refresh"                      "nop"
menu-add CDEWorkspace "Minimize/Restore Front Panel" "exec cde-toggle-frontpanel"
menu-add CDEWorkspace - -
menu-add CDEWorkspace "Restart Workspace Manager..." "exec cde-restart-dtwm"
menu-add CDEWorkspace - -
menu-add CDEWorkspace "Log out..."                   "exec cde-logout"
menu-add CDEWorkspace - -
menu-add CDEWorkspace "Previous Workspace"           "exec cde-wsm prev"
menu-add CDEWorkspace "Next Workspace"               "exec cde-wsm next"
menu-add CDEWorkspace - -
menu-add CDEWorkspace "Terminal"                     "exec dtterm"
menu-add CDEWorkspace "Files"                        "exec dtfile -"
menu-add CDEWorkspace "Lock Screen"                  "exec waylock"

# The window menu (dtwm's builtinSystemMenu): the titlebar menu button and
# Alt+Space post it, as in CDE.  "Restore" is window-maximize -u; "Occupy
# Workspace..." reuses CoW's dynamic SendToDesk submenu.
menu-add -T CDEWindow "Window" title
menu-add CDEWindow "Restore"               "window-maximize -u"
menu-add CDEWindow "Move"                  "window-move"
menu-add CDEWindow "Size"                  "window-resize"
menu-add CDEWindow "Minimize"              "winops -i"
menu-add CDEWindow "Maximize"              "window-maximize -m"
menu-add CDEWindow "Lower"                 "winops -l"
menu-add CDEWindow - -
menu-add CDEWindow "Occupy Workspace..."   "popup SendToDesk"
menu-add CDEWindow "Occupy All Workspaces" "winops -s"
menu-add CDEWindow - -
menu-add CDEWindow "Close"                 "winops -c"

# CDE window decorations: a menu button on the left, minimize then maximize on
# the right.
bind-decoration 1 menu-show CDEWindow
bind-decoration 0 winops -i
bind-decoration 2 window-maximize -m

# _MOTIF_WM_HINTS: the shim (xlib-wayland) cannot make CoW refuse a command,
# but it can hide the titlebar button a client disabled.  It applies these
# sparse decor profiles per window with `decor -a PROFILE -t /title/`.  Button
# 0 is the minimize button, button 2 the maximize button; the close function has
# no button in the CDE layout (it is the window menu's Close item, whose
# river close request the shim already ignores).
decor -d cde-func-min titlebar.button.0.vector none
decor -d cde-func-max titlebar.button.2.vector none

bind L+Return exec dtterm
bind L+d menu-show CDEApps

# MWM/CDE key bindings (dtwm's DefaultKeyBindings and the window-menu
# accelerators), so windows behave the way CDE users expect.
bind A+space menu-show CDEWindow
bind A+Tab focus -nw
bind AS+Tab focus -pw
bind A+Escape winops -l
bind AS+Escape winops -r
bind A+F6 focus -nw
bind AS+F6 focus -pw
bind A+F3 winops -l
bind A+F4 winops -c
bind A+F5 window-maximize -u
bind A+F7 window-move
bind A+F8 window-resize
bind A+F9 winops -i
bind A+F10 window-maximize -m

# Btn3 on the root posts the Workspace Manager menu, as in CDE.
mouse R:0+right menu-show CDEWorkspace
