# cde-wayland per-workspace desktop backdrop.
#
# In CDE the workspace backdrop is set with the Style Manager (dtstyle) and kept
# by dtwm; dtwm's backdrop is a full-screen override-redirect window, which the
# shim keeps out of the Wayland tree, and the desktop is drawn by CoW.  So the
# per-workspace backdrop is applied here instead: the Workspace Manager bridge
# (cde-wsm-desk) sets CoW's output background when the workspace changes.
#
# One line per workspace:
#     <index> <colour> [image-path]
# The colour is the base; the image (PNG/SVG/XPM) tiles over it.  CoW accepts
# "none" to clear an image.  Workspaces without a line keep the default
# (cow.conf's output.colour.background).
#
# CDE's default is the desktop grey; these are distinct neutral tones so a
# workspace change is visible.
0 0x2e3440
1 0x3b4252
2 0x434c5e
3 0x4c566a
